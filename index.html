
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DON'T GET MAD! - Ragebait Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #171717;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 20px;
}

h1 {
    color: #ffcc00;
    font-size: 36px;
}

.stats {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    flex-wrap: wrap;
    background: #292929;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
}

.arena {
    height: 370px;
    margin-top: 20px;
    background: #292929;
    border: 3px solid #ffcc00;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
}

#message {
    padding: 18px;
    font-size: 19px;
    font-weight: bold;
}

button {
    border: none;
    padding: 13px 20px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

#target, #fake {
    position: absolute;
    background: #ffcc00;
    color: black;
    left: 50%;
    top: 65%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
}

#fake {
    background: #ff3333;
    color: white;
    display: none;
}

#answer {
    display: none;
    position: absolute;
    top: 65%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 190px;
    padding: 13px;
    border-radius: 8px;
    border: 2px solid #ffcc00;
    text-align: center;
    font-size: 16px;
}

#timer {
    color: #ff7777;
    font-weight: bold;
    font-size: 18px;
    min-height: 22px;
}

#feedback {
    color: #ffcc00;
    min-height: 30px;
    font-weight: bold;
}

.start {
    background: #ffcc00;
    color: black;
    margin-top: 15px;
    font-size: 16px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.footer {
    color: #888;
    font-size: 12px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>😈 DON'T GET MAD!</h1>
<p>10 Levels of Pure Frustration 😂</p>

<div class="stats">
    <div>⭐ Score: <span id="score">0</span></div>
    <div>💢 Fails: <span id="fails">0</span></div>
    <div>Level: <span id="level">1</span>/10</div>
</div>

<p id="timer"></p>

<div class="arena" id="arena">

    <div id="message">PRESS START TO PLAY!</div>

    <button id="target" type="button">CLICK ME!</button>

    <button id="fake" type="button">CLICK ME!</button>

    <input
        id="answer"
        type="text"
        placeholder="Type BANANA"
        autocomplete="off"
    >

</div>

<p id="feedback">Are you ready to lose your patience? 😂</p>

<button class="start" id="start" type="button">
START GAME
</button>

<p class="footer">
WARNING: This game may destroy your patience! 😭
</p>

</div>

<script>

const scoreDisplay = document.getElementById("score");
const failsDisplay = document.getElementById("fails");
const levelDisplay = document.getElementById("level");

const arena = document.getElementById("arena");
const target = document.getElementById("target");
const fake = document.getElementById("fake");
const answer = document.getElementById("answer");

const message = document.getElementById("message");
const feedback = document.getElementById("feedback");
const timerDisplay = document.getElementById("timer");
const startButton = document.getElementById("start");

let score = 0;
let fails = 0;
let level = 1;
let clicks = 0;
let active = false;
let timeLeft = 0;
let timer = null;

const challenges = [
    "LEVEL 1: CLICK THE BUTTON!",
    "LEVEL 2: CATCH THE MOVING BUTTON!",
    "LEVEL 3: DON'T CLICK THE RED BUTTON!",
    "LEVEL 4: CLICK THE BUTTON 3 TIMES!",
    "LEVEL 5: WAIT FOR 5 SECONDS!",
    "LEVEL 6: TYPE THE WORD BANANA!",
    "LEVEL 7: CLICK BEFORE TIME RUNS OUT!",
    "LEVEL 8: CLICK THE BUTTON THAT SAYS WRONG!",
    "LEVEL 9: CLICK THE BUTTON 5 TIMES!",
    "LEVEL 10: FINAL BOSS! DON'T CLICK!"
];

function updateStats() {
    scoreDisplay.textContent = score;
    failsDisplay.textContent = fails;
    levelDisplay.textContent = Math.min(level, 10);
}

function stopTimer() {
    clearInterval(timer);
    timer = null;
}

function position(button) {
    const maxX = Math.max(5, arena.clientWidth - button.offsetWidth - 10);
    const maxY = Math.max(85, arena.clientHeight - button.offsetHeight - 15);

    const x = 5 + Math.random() * Math.max(0, maxX - 5);
    const y = 75 + Math.random() * Math.max(0, maxY - 75);

    button.style.left = x + "px";
    button.style.top = y + "px";
    button.style.transform = "none";
}

function resetArena() {
    stopTimer();

    target.style.display = "block";
    target.disabled = false;

    fake.style.display = "none";
    answer.style.display = "none";

    timerDisplay.textContent = "";

    target.style.background = "#ffcc00";
    target.style.color = "black";

    target.textContent = "CLICK ME!";
    fake.textContent = "CLICK ME!";
}

function fail(text) {
    fails++;
    feedback.textContent = text;
    updateStats();
}

function winLevel() {
    stopTimer();

    score += 100;
    level++;
    clicks = 0;

    updateStats();

    if (level > 10) {
        finishGame();
        return;
    }

    showLevel();
}

function finishGame() {
    active = false;
    stopTimer();

    target.style.display = "none";
    fake.style.display = "none";
    answer.style.display = "none";

    message.textContent = "🏆 YOU BEAT ALL 10 LEVELS!";

    feedback.textContent =
        "FINAL SCORE: " + score +
        " | TOTAL FAILS: " + fails +
        " | YOU ARE A RAGEBAIT LEGEND!";

    timerDisplay.textContent = "";

    startButton.textContent = "PLAY AGAIN";
}

function showLevel() {
    resetArena();

    clicks = 0;

    message.textContent = challenges[level - 1];

    feedback.textContent = "Good luck! You'll need it. 😂";

    if (level === 1) {
        target.textContent = "CLICK ME!";
        position(target);
    }

    else if (level === 2) {
        target.textContent = "CATCH ME!";
        position(target);
    }

    else if (level === 3) {
        target.textContent = "SAFE BUTTON";
        target.style.background = "#ffcc00";

        fake.style.display = "block";
        fake.textContent = "CLICK ME!";

        position(target);
        position(fake);
    }

    else if (level === 4) {
        target.textContent = "0 / 3";
        position(target);
    }

    else if (level === 5) {
        target.textContent = "WAIT...";
        target.disabled = true;

        timeLeft = 5;
        timerDisplay.textContent = "WAIT: 5 SECONDS";

        timer = setInterval(() => {
            timeLeft--;

            timerDisplay.textContent =
                "WAIT: " + timeLeft + " SECONDS";

            if (timeLeft <= 0) {
                stopTimer();

                target.disabled = false;
                target.textContent = "NOW CLICK ME!";
                feedback.textContent = "FINALLY! NOW CLICK IT!";
                position(target);
            }
        }, 1000);
    }

    else if (level === 6) {
        target.style.display = "none";
        answer.style.display = "block";
        answer.value = "";
        answer.focus();
    }

    else if (level === 7) {
        target.textContent = "HURRY!";

        timeLeft = 8;
        timerDisplay.textContent = "TIME LEFT: 8";

        position(target);

        timer = setInterval(() => {
            timeLeft--;

            timerDisplay.textContent =
                "TIME LEFT: " + timeLeft;

            if (timeLeft <= 0) {
                stopTimer();

                if (active && level === 7) {
                    fail("TIME'S UP! HAHAHA! 😂");
                    startLevel7();
                }
            }
        }, 1000);
    }

    else if (level === 8) {
        target.textContent = "WRONG";
        position(target);
    }

    else if (level === 9) {
        target.textContent = "0 / 5";
        position(target);
    }

    else if (level === 10) {
        target.textContent = "DON'T CLICK!";
        position(target);
    }
}

function startLevel7() {
    stopTimer();

    timeLeft = 8;
    timerDisplay.textContent = "TIME LEFT: 8";

    position(target);

    timer = setInterval(() => {
        timeLeft--;

        timerDisplay.textContent =
            "TIME LEFT: " + timeLeft;

        if (timeLeft <= 0) {
            stopTimer();

            if (active && level === 7) {
                fail("TIME'S UP! TRY AGAIN! 😂");
                startLevel7();
            }
        }
    }, 1000);
}

function startGame() {
    stopTimer();

    score = 0;
    fails = 0;
    level = 1;
    clicks = 0;
    active = true;

    startButton.textContent = "RESTART GAME";

    updateStats();
    showLevel();
}

function play() {
    if (!active || target.disabled) return;

    if (level === 1) {
        winLevel();
    }

    else if (level === 2) {
        clicks++;

        if (clicks >= 3) {
            winLevel();
        } else {
            fail("HAHA! YOU ALMOST GOT IT! 😂");
            position(target);
        }
    }

    else if (level === 3) {
        winLevel();
    }

    else if (level === 4) {
        clicks++;

        target.textContent = clicks + " / 3";

        if (clicks >= 3) {
            winLevel();
        } else {
            feedback.textContent = "KEEP CLICKING!";
        }
    }

    else if (level === 5) {
        winLevel();
    }

    else if (level === 7) {
        winLevel();
    }

    else if (level === 8) {
        winLevel();
    }

    else if (level === 9) {
        clicks++;

        target.textContent = clicks + " / 5";

        if (clicks >= 5) {
            winLevel();
        } else {
            feedback.textContent = "ALMOST THERE! 😂";
            position(target);
        }
    }

    else if (level === 10) {
        clicks++;

        if (clicks >= 5) {
            winLevel();
        } else {
            fail("I SAID DON'T CLICK! 😭");
            position(target);
        }
    }
}

target.addEventListener("click", play);

fake.addEventListener("click", () => {
    if (!active || level !== 3) return;

    fail("HAHAHA! YOU CLICKED THE RED BUTTON! 😈");
    position(fake);
});

answer.addEventListener("input", () => {
    if (
        active &&
        level === 6 &&
        answer.value.trim().toLowerCase() === "banana"
    ) {
        winLevel();
    }
});

arena.addEventListener("click", (event) => {
    if (!active) return;

    if (
        event.target === target ||
        event.target === fake ||
        event.target === answer
    ) {
        return;
    }

    if (level === 3) {
        fail("WRONG! CLICK THE YELLOW BUTTON!");
    }

    else if (level === 10) {
        fail("DON'T TOUCH THE BACKGROUND! 😂");
    }
});

startButton.addEventListener("click", startGame);

// Start the game automatically.
startGame();

</script>

</body>
</html>
